name: "dig-app CodeQL config"

# dig_ecosystem#3205: excludes CodeQL's own INTERNAL Rust diagnostic/telemetry/metric queries.
#
# WHAT THIS FILE DOES AND DOES NOT BUY, measured on three real runs of CodeQL 2.26.4 /
# codeql/rust-queries 0.1.41, all on 2026-09-06 against this repo's PR #397:
#
#   run 34027560462 (GitHub default setup, unfiltered, 36 queries, SUCCESS, 122m24s):
#     extraction 5m44s -> TRAP import 1m28s -> 12 cheap diagnostic/summary queries done by
#     eval-minute 6 -> TypeInferenceConsistencyCounts done at eval 54m32s ->
#     NodesWithTypeAtLengthLimit done at eval 113m21s -> then ALL 16 security/CWE-* queries
#     finish inside the next 45 SECONDS, each stamped "eval 113mXXs".
#   run 34027562265 (this workflow, round-1 filters = 2 exclusions, 34 queries, CANCELLED at
#     the 30-minute job timeout): the 2 exclusions provably applied ("Loaded N/34"), the same
#     12 cheap queries finished by eval-minute 6, then nothing else finished in 16 minutes.
#   run 34034753310 (this workflow, round-2 filters = 20 exclusions, 16 queries, CANCELLED at
#     a 90-minute job timeout): extraction 6m15s -> TRAP import 1m39s -> all 16 security
#     queries start by 13:08:42Z -> NOT ONE finishes in the following 81m27s.
#
# Read together those three runs say one thing: the ~113 minutes is a SHARED type-inference
# relation (codeql.rust.internal.typeinference) that every Rust taint/data-flow security
# query depends on for call resolution. In the unfiltered run the two type-inference
# telemetry queries merely happened to be its FIRST consumers, so the cost was booked against
# them and the security queries looked free ("finish within seconds of each other" -- of each
# other, 113 minutes in). Exclude the two reporters and the identical cost moves into the
# security queries themselves. The original "two internal queries dominate" diagnosis was a
# misattribution of a shared predicate, not a root cause.
#
# So this exclusion list is CORRECT and HARMLESS but it is NOT a latency fix. Every query
# below is `@kind diagnostic` or `@kind metric` (confirmed against each file's own header at
# github/codeql main, rust/ql/src/queries/{diagnostics,summary,telemetry}/*.ql); code-scanning
# only turns `@kind problem` / `@kind path-problem` into alerts, so excluding these removes
# zero security coverage and saves ~6 minutes of cheap query work plus GitHub's own
# database-quality telemetry rows. Together with round 1's two, the 20 exclusions leave exactly
# the 16 `security/CWE-*/*.ql` queries -- every query that can produce an alert -- running.
#
# What would actually move the Rust wall time, none of which this file can express:
#   - a newer CodeQL with faster Rust type inference (none exists: 2.26.4 IS the latest bundle
#     and the one github/codeql-action@v4 already pins),
#   - a larger runner (the org has no GitHub-hosted larger runners configured, and 14.5 GB /
#     4 threads showed no memory pressure -- this is CPU-bound relational evaluation),
#   - not running the Rust analysis on every pull_request at all (a gate-shape decision that
#     lives in codeql.yml and branch protection, not here).
query-filters:
  - exclude:
      id: rust/diagnostics/type-inference-consistency-counts
  - exclude:
      id: rust/summary/nodes-at-type-path-length-limit
  - exclude:
      id: rust/diagnostics/ast-consistency-counts
  - exclude:
      id: rust/diagnostics/data-flow-consistency-counts
  - exclude:
      id: rust/diagnostics/cfg-consistency-counts
  - exclude:
      id: rust/diagnostics/ssa-consistency-counts
  - exclude:
      id: rust/diagnostics/successfully-extracted-files
  - exclude:
      id: rust/diagnostics/extraction-errors
  - exclude:
      id: rust/diagnostics/extraction-warnings
  - exclude:
      id: rust/diagnostics/unextracted-elements
  - exclude:
      id: rust/diagnostics/unresolved-macro-calls
  - exclude:
      id: rust/diagnostic/database-quality
  - exclude:
      id: rust/telemetry/extraction-information
  - exclude:
      id: rust/summary/query-sink-counts
  - exclude:
      id: rust/summary/summary-statistics
  - exclude:
      id: rust/summary/reduced-summary-statistics
  - exclude:
      id: rust/summary/lines-of-code
  - exclude:
      id: rust/summary/lines-of-user-code
  - exclude:
      id: rust/summary/number-of-files-extracted-with-errors
  - exclude:
      id: rust/summary/number-of-successfully-extracted-files
