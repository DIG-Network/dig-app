# CodeQL advanced setup (dig_ecosystem#3205). Replaces GitHub's DEFAULT setup, which the
# platform runs as `dynamic/github-code-scanning/codeql` -- no file here, no `concurrency:`
# control, and no way to filter its query suite. Default setup's lack of a concurrency
# group meant every push started a brand-new full analysis and the superseded ones were
# NEVER cancelled: measured 2026-09-06, six CodeQL runs were in-progress at once across
# two open PRs (#394 x2, #395 x4), each queuing behind stale, already-superseded work.
#
# The 130-minute latency itself was NOT the stacking, though -- a single, uncontested run
# (job 101430031199, PR #395) still took ~101 minutes end to end, and this file does NOT fix
# that. Three measured runs (detailed in .github/codeql/codeql-config.yml) put the Rust cost
# at ~6 min extraction + ~1.5 min TRAP import + ~113 min of ONE shared type-inference
# relation that every Rust taint/data-flow security query depends on + <1 min for the
# security queries themselves. Excluding CodeQL's internal diagnostic/telemetry queries is
# correct and costs no coverage, but it removes only ~6 minutes: the two "expensive"
# queries round 1 blamed were merely the first consumers of that shared relation, and with
# them gone the identical ~113 minutes moved into the 16 security queries (run 34034753310:
# all 16 started by 13:08:42Z, none finished in the next 81m27s). CodeQL 2.26.4 is the
# latest bundle and the org has no larger runners, so on this workflow's current shape the
# Rust job's floor on a standard runner is ~2 hours, and `timeout-minutes` below cannot be
# both "fails fast on a regression" and "long enough to pass". The remaining lever is a
# gate-shape decision -- whether `Analyze (rust)` runs on every pull_request at all, or on
# `push: main` + the weekly schedule only -- which is deliberately NOT taken in this file
# without the orchestrator's call (dig_ecosystem#3205 carries the options and evidence).
#
# Default-setup handoff, verified: GitHub's `dynamic/github-code-scanning/codeql` kept firing
# on pushes to this PR *after* `code-scanning/default-setup` read back `state: not-configured`
# (e1c3b0c4 and b61011eb, 2026-09-06 10:28/10:29, each still got a ~122-minute default-setup
# run beside this workflow's own job on the same SHA) -- a propagation lag, not a permanent
# gap: the next push (b7d8529a, 13:00Z) produced NO dynamic run at all. The consequence is
# sharper than the lag: with default setup off and this file not yet on `main`, any OTHER PR
# gets no `Analyze (rust)` check-run whatsoever, and a REQUIRED context that never appears
# reads as ABSENT and blocks that PR's merge (dig-app#395 head 991ddf15: zero such check
# runs, measured 2026-09-06 14:35Z). Until this file lands on `main`, that hazard is live.
#
# `permissions:` is least-privilege for a public repo (CLAUDE.md §1.9 security tax):
# `security-events: write` to upload SARIF, `actions: read` for the `actions`-language
# analysis, `contents: read` to check out. No `packages:` scope -- that's only needed for
# private-repo CodeQL packs, and this repo is public.
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Matches the cadence default setup ran (`schedule: weekly`, Sunday early UTC).
    - cron: "23 6 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # PLACEHOLDER, deliberately fail-fast, and NOT shippable as-is: the Rust job's MEASURED
    # floor on this shape is ~2 hours (see header), so 30 fails on every PR by construction,
    # and so did the 90 this PR briefly tried (run 34034753310, cancelled at 90m11s with all
    # 16 security queries still evaluating). A passing value would have to clear today's
    # observed default-setup spread of 101-199 minutes -- i.e. ~210 -- which codifies the
    # very wait dig_ecosystem#3205 exists to remove. Left at 30 so an accidental merge burns
    # 30 runner-minutes per PR instead of 210 while the gate-shape decision is pending; the
    # three languages that finish in under a minute are unaffected either way.
    timeout-minutes: 30
    # `build-mode` is deliberately NOT a second matrix axis: every language here uses
    # `none` (Rust supports it per GitHub's own build-options docs; the other three are
    # interpreted languages, which always do). A matrix axis with no variation still gets
    # appended to the check name -- confirmed live on this PR, where varying it produced
    # `Analyze (rust, none)` instead of the `Analyze (rust)` branch protection requires.
    # Single-axis matrix keeps the check name IDENTICAL to what default setup registered,
    # so no branch-protection update is needed for this job at all.
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Default setup already had this on for every language (verified in its own job
          # log); carried forward so this switch cannot regress extraction time.
          dependency-caching: true
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Matches default setup's own category exactly (verified from its job log), so
          # existing alerts keep the same identity instead of appearing to move or duplicate.
          category: "/language:${{ matrix.language }}"
