# The ONE place dig-app's cross-OS binary build lives. It is a REUSABLE workflow
# (`on: workflow_call` only): both release paths call it, so the OS/arch matrix + toolchain setup
# are defined exactly once (DRY, CLAUDE.md §2.5):
#
#   * release.yml         — the STABLE `vX.Y.Z` tag builder, and
#   * nightly-release.yml  — the NIGHTLY pre-release channel.
#
# The caller passes the version string stamped into each artifact's filename and, optionally, the
# git ref to build. For every supported OS/arch this builds BOTH first-class dig-app binaries
# (per the epic #908 form factors):
#   * `dig-app` — the branded per-user tray / menu-bar identity agent (degrades headless), and
#   * `diga`    — the DIG user CLI.
#
# ASSET NAMING (SPEC §Release) — each per-OS/arch binary is published under the canonical name
# `<bin>-<ver>-<os>-<arch>[.exe]` (e.g. `dig-app-1.2.3-linux-x64`, `diga-1.2.3-windows-x64.exe`) —
# the stems the dig-installer + apt.dig.net packaging resolve.
#
# RICHER OS PACKAGES (Windows MSI/tray installer, macOS .app/.pkg, Linux .deb) are produced by the
# dig-installer wiring (epic #908 U8, a separate repo) which consumes these raw binaries; this
# reusable build stays the single source of the binaries themselves.
#
# `linux-arm64` IS published (dig-app#236, dig_ecosystem#3123). It builds NATIVELY on the free
# public-repo `ubuntu-24.04-arm` runner, so the GTK tray stack is linked by a native toolchain and
# nothing is cross-compiled. The previous rationale recorded here — "no consumer requests it;
# matches dig-node" — was false in both halves: dig-node has published linux-arm64 since
# dig_ecosystem#1741, and the standing DIG fleet is Ubuntu 24.04 arm64, which could install NO
# dig-app artifact at all while this matrix omitted the arch.
name: Build binaries (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string stamped into each artifact filename (e.g. `1.2.3` or `1.2.3-nightly.20260714.abc1234`)."
        type: string
        required: true
      ref:
        description: "Git ref (tag / branch / SHA) to check out and build. Empty = the caller run's commit."
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  # Gate: fmt + clippy on Linux, once. A ref that doesn't pass the gate never produces release
  # binaries. The full test+coverage set ran on the PR (ci.yml) / the nightly test-gate.
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rust (stable + components)
        run: |
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable
          rustc --version
      # The default `tray` feature links the desktop tray stack (GTK on Linux). NOT libxdo: it is
      # disabled in the workspace manifest, because a DT_NEEDED entry on `libxdo.so.3` killed the
      # shipped binary before `main` on stock Ubuntu (dig_ecosystem#1753).
      - name: Install tray build deps (Linux)
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      # NO BUILD CACHE ON THE RELEASE PATH (dig-app#247, CodeQL `actions/cache-poisoning`).
      # This workflow checks out `inputs.ref` — an arbitrary ref — while `github.ref` stays the
      # DEFAULT BRANCH, because both callers are triggered by `schedule` / `workflow_dispatch` on
      # `main`. Anything a cache action saved here would therefore land in the default-branch cache
      # scope, where every later privileged release build restores it. A single dispatch pointed at
      # an untrusted ref could seed compiler output / build-script artifacts that are then linked
      # into signed, published binaries — a supply-chain path whose blast radius is every install,
      # not this repo. Release builds are consequently COLD and self-contained: slower, and the
      # only artifacts they can contain are ones this run compiled from the checked-out source.
      # `ci.yml` still caches; it is not the artifact-producing path.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: build (${{ matrix.out_name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            out_name: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            out_name: linux-x64
          # NATIVE arm64 — not a cross-compile. `ubuntu-24.04-arm` is free on public repos, and
          # every Linux-specific step below keys on `runner.os == 'Linux'` (arch-agnostic) with
          # every filename derived from `out_name`, so this one row yields all three Linux arm64
          # assets: the tray `dig-app`, the headless `dig-app`, and `diga`.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            out_name: linux-arm64
          - os: macos-14 # Apple silicon (arm64)
            target: aarch64-apple-darwin
            ext: ""
            out_name: macos-arm64
          - os: macos-14 # Apple silicon — cross-compiles the Intel binary
            target: x86_64-apple-darwin
            ext: ""
            out_name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rust + target
        shell: bash
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version
      # The default `tray` feature links the desktop tray stack (GTK on Linux). NOT libxdo: it is
      # disabled in the workspace manifest, because a DT_NEEDED entry on `libxdo.so.3` killed the
      # shipped binary before `main` on stock Ubuntu (dig_ecosystem#1753). macOS +
      # Windows carry their tray stack in the OS SDK, so only Linux needs extra dev libraries.
      - name: Install tray build deps (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      # NO BUILD CACHE ON THE RELEASE PATH (dig-app#247, CodeQL `actions/cache-poisoning`).
      # This workflow checks out `inputs.ref` — an arbitrary ref — while `github.ref` stays the
      # DEFAULT BRANCH, because both callers are triggered by `schedule` / `workflow_dispatch` on
      # `main`. Anything a cache action saved here would therefore land in the default-branch cache
      # scope, where every later privileged release build restores it. A single dispatch pointed at
      # an untrusted ref could seed compiler output / build-script artifacts that are then linked
      # into signed, published binaries — a supply-chain path whose blast radius is every install,
      # not this repo. Release builds are consequently COLD and self-contained: slower, and the
      # only artifacts they can contain are ones this run compiled from the checked-out source.
      # `ci.yml` still caches; it is not the artifact-producing path.
      - name: Build release binaries (dig-app + diga)
        run: cargo build --release --locked --target ${{ matrix.target }} --bin dig-app --bin diga
      # A SECOND Linux dig-app: the same shell with the `tray` feature off, so it links no desktop
      # stack at all. The tray build hard-links GTK 3 (8 DT_NEEDED entries), which a stock Ubuntu
      # Server / cloud image does not have — and a missing library kills the process in the loader,
      # before `main`, so the shell's own headless degradation can never be reached there
      # (dig_ecosystem#1753). This artifact is the one that runs on such a host. It is ADDITIVE: the
      # primary `dig-app-<ver>-linux-x64` asset stays the tray build for desktop sessions.
      # A separate `--target-dir` keeps it from overwriting the tray binary at the same path.
      - name: Build the headless Linux binary (no desktop stack)
        if: runner.os == 'Linux'
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --target-dir target-headless --no-default-features --package dig-app --bin dig-app
      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ inputs.version }}"
          EXT="${{ matrix.ext }}"
          mkdir -p dist
          for bin in dig-app diga; do
            SRC="target/${{ matrix.target }}/release/${bin}${EXT}"
            test -f "$SRC" || { echo "binary not produced: $SRC"; exit 1; }
            cp "$SRC" "dist/${bin}-${VER}-${{ matrix.out_name }}${EXT}"
          done
          if [ "${{ runner.os }}" = "Linux" ]; then
            HEADLESS="target-headless/${{ matrix.target }}/release/dig-app"
            test -f "$HEADLESS" || { echo "headless binary not produced: $HEADLESS"; exit 1; }
            cp "$HEADLESS" "dist/dig-app-${VER}-${{ matrix.out_name }}-headless"
          fi
          ls -la dist
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dig-app-${{ matrix.out_name }}
          path: dist/*
          if-no-files-found: error

  # PROOF, not inference: a compiled artifact is not a working one, and the whole point of
  # dig-app#236 is that arm64 users have nothing — so shipping an arm64 file that does not execute
  # would be worse than the honest absence it replaces. This job EXECUTES every arm64 asset on a
  # native arm64 runner before the caller's publish job can attach it.
  #
  # Scoped to arm64 deliberately: it is the newly-added, never-yet-shipped target. linux-x64 has
  # been published and running for many releases, so gating it here would add runtime to every
  # release to re-prove a settled fact (widening this to x64 is a reasonable follow-up, not a
  # precondition for arm64 existing at all).
  #
  # WHY `--version`: it returns before the logging stack, the agent and any tray (see
  # `crates/dig-app/src/bin/dig-app.rs`), so it touches no config, network, filesystem state or
  # display. That isolates the one question worth asking here — does the dynamic loader resolve
  # this binary on this architecture.
  verify-linux-arm64:
    name: verify (linux-arm64 executes)
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dig-app-linux-arm64
          path: dist

      # An independent check from execution, and it is the one that catches the nearest wrong
      # build: a target triple typo that produces an x86-64 ELF under an `-linux-arm64` filename.
      # Execution alone could mask that if the runner ever grew binfmt emulation; the ELF header
      # cannot.
      - name: Assert every artifact is a real aarch64 ELF
        env:
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          chmod +x dist/*
          # Count FIRST. The per-file loop below only inspects what is present, so a matrix row
          # that built but skipped the headless step would leave a short `dist/` that every
          # remaining assertion passes over in silence. Naming the expected three makes an absent
          # artifact fail here, where the message says so, rather than downstream as a confusing
          # missing-file error.
          for stem in "dig-app-$V-linux-arm64" "dig-app-$V-linux-arm64-headless" "diga-$V-linux-arm64"; do
            test -f "dist/$stem" || { echo "::error::expected artifact missing: $stem"; exit 1; }
          done
          test "$(ls -1 dist | wc -l)" -eq 3 || { echo "::error::unexpected count: $(ls -1 dist)"; exit 1; }
          for bin in dist/*; do
            echo "== $bin"
            file -b "$bin"
            file -b "$bin" | grep -q 'ARM aarch64' \
              || { echo "::error::$bin is not an aarch64 ELF"; exit 1; }
          done

      # The headless asset's defining property is that it links NO desktop stack, so it must start
      # on a base image that has none. A bare `ubuntu:24.04` carries no libgtk-3-0 — that absence
      # is the fixture: were the headless build to acquire a GTK DT_NEEDED entry, the loader would
      # kill it here, before `main`, which is exactly how dig_ecosystem#1753 shipped unnoticed.
      - name: The headless dig-app starts with no desktop stack present
        env:
          BIN: dig-app-${{ inputs.version }}-linux-arm64-headless
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" -e BIN ubuntu:24.04 \
            sh -c 'ldd "/dist/$BIN" || true'
          docker run --rm -v "$PWD/dist:/dist:ro" -e BIN ubuntu:24.04 \
            sh -c '"/dist/$BIN" --version'

      # `diga` is a separate link, so a tray-stack regression in it would be invisible behind the
      # dig-app checks above.
      - name: diga starts with no desktop stack present
        env:
          BIN: diga-${{ inputs.version }}-linux-arm64
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" -e BIN ubuntu:24.04 \
            sh -c '"/dist/$BIN" --version'

      # The tray asset DOES link GTK 3, so it is proved against a host that has the GTK RUNTIME
      # (not the -dev headers the build needed). This is the check that the arm64 GTK link actually
      # resolves — the risk that made arm64 look hard in the first place.
      - name: The tray dig-app starts against the GTK runtime
        env:
          BIN: dig-app-${{ inputs.version }}-linux-arm64
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" -e BIN ubuntu:24.04 sh -c '
            set -eu
            apt-get update -qq
            apt-get install -y --no-install-recommends libgtk-3-0 >/dev/null
            ldd "/dist/$BIN" || true
            "/dist/$BIN" --version
          '
