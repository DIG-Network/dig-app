# PR quality gates for the dig-app Rust workspace: formatting, linting, tests, and a GATED
# coverage report (>=80% lines, CLAUDE.md §2.3/§2.4a). Runs on every PR to main and on pushes to
# main so the default branch stays green. Job `name:`s are stable — they are the required-check
# contexts wired on the protected branch.
#
# Toolchain pin (dig-app#133): every `dtolnay/rust-toolchain@master` step below sets
# `toolchain:` to the SAME version pinned in the repo-root `rust-toolchain.toml` (which is
# what a local `cargo`/`rustc` picks up automatically). The action has no mechanism to read
# that file itself -- verified against its action.yml, which only ever resolves an explicit
# `toolchain:` input or the literal default baked into its `@stable`/`@nightly`/etc. branch --
# so the two are kept in sync by hand. Bump BOTH in the same commit when moving the pin.
#
# Local rustdoc repro (dig-app#336): CI's doc-link-hygiene step below denies
# `rustdoc::broken_intra_doc_links` and `rustdoc::private_intra_doc_links`. Reproduce it before
# pushing with, e.g.:
# Set RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
# then run: cargo doc --no-deps --workspace --all-features
# `cargo test` and `cargo clippy` do not run rustdoc and cannot catch this class of failure.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege: CI only reads the checked-out repo (GHAS/CodeQL requirement).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # SPEC.md section 3.1b-lv: "A phase MUST be stamped by production code, not only by
  # tests." Nothing checked that until dig-app#101: deleting BOTH `canvas.during(...)`
  # stamps in dig-app.rs reproduces dig-app#97's finding (a render loop wedged in
  # Shell_NotifyIcon freezes the tray with zero log lines) while `cargo test -p dig-app`
  # stays fully green, because pump_vigil.rs's own tests stamp the phase themselves. No
  # Rust build is needed to check this, so it runs as its own fast job rather than as a
  # step buried inside `test` below.
  phase-stamps:
    name: Phase-stamp guard (dig-app#101)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the guard's own adversarial test suite
        run: python3 scripts/tests/check-phase-stamps.test.py
      - name: Check every Phase variant has a non-test production stamp
        run: python3 scripts/check-phase-stamps.py .

  # Thirteen lane-scratch paths (`.lane/`, `.lane-2398`, `LANE-334.md`, `.loop/2939-anchor.txt`,
  # ...) reached `main` inside squashes whose reviewer was reading the substantive diff
  # (dig-app#178, #175). The push-early rule that creates them is correct and stays -- what was
  # missing is that nothing removed them afterwards. This guard scans the TRACKED TREE rather
  # than the PR diff: a diff check needs the base ref, which a shallow CI clone does not have,
  # and a guard that degrades to "no base, nothing to compare, pass" is the exact failure this
  # ticket is about. No Rust build is needed, so it runs as its own fast job.
  scratch-paths:
    name: Lane-scratch guard (dig-app#178)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the guard's own adversarial test suite
        run: python3 scripts/tests/check-scratch-paths.test.py
      - name: Check no lane-scratch path is tracked
        run: python3 scripts/check-scratch-paths.py .

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      # The default `tray` feature links the desktop tray stack (GTK on Linux; NOT libxdo, see
      # dig_ecosystem#1753); install its
      # system dev libraries so `--all-features` compiles here. Runtime still degrades headless.
      - name: Install tray build deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The `linux-x64-headless` artifact is built with `--no-default-features`, a configuration NO other
  # gate compiles: `clippy` above runs `--all-features`, so a feature-gating break in the no-`tray`
  # build stayed invisible until a tag was already pushed and `release.yml` went red (v9.2.0 —
  # `Agent` was imported behind `#[cfg(feature = "tray")]` but used unconditionally). This job
  # mirrors the release flags from `build-binaries.yml` so that break fails on the PR instead.
  headless:
    name: Headless build (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      # No GTK install here, deliberately: a headless build that needs the tray's system libraries
      # is not headless, so leaving them out keeps this job honest about what it proves.
      - name: cargo clippy -D warnings (headless dig-app shell)
        run: cargo clippy --no-default-features --locked --package dig-app --bin dig-app -- -D warnings
      # The `--no-default-features` TESTS had no job anywhere: clippy above does not build
      # `#[cfg(test)]` items, and the coverage gate runs `--all-features`, which can never turn
      # `tray` OFF. So every assertion guarding headless-only behaviour was unprovable by CI while
      # looking green -- which is how the `--help` no-desktop claim shipped wrong twice. This step is
      # in a REQUIRED job on purpose: a guard that only a non-required job runs is a guard that gets
      # ignored on the day it fires.
      - name: cargo test (headless dig-app shell)
        run: cargo test --no-default-features --locked --package dig-app --lib

  test:
    name: Test + coverage (>=80% lines, gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview
      # The default `tray` feature links the desktop tray stack (GTK on Linux). NOT libxdo: it is
      # disabled in the workspace manifest, because a DT_NEEDED entry on `libxdo.so.3` killed the
      # shipped binary before `main` on stock Ubuntu (dig_ecosystem#1753).
      - name: Install tray build deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # `cargo llvm-cov nextest` runs the flaky-aware nextest runner UNDER coverage instrumentation
      # (one combined invocation — separate steps collect zero coverage). The gate fails the build
      # below the 80% line floor. The `dig-app` binaries are thin, largely GUI/event-loop shells
      # over `dig-app-core` (where all logic + its coverage lives, per the crate design), so they are
      # excluded from the line gate — chasing coverage of the platform event loop is not meaningful.
      - name: Run tests with 80% line-coverage gate
        run: cargo llvm-cov nextest --workspace --all-features --locked --ignore-filename-regex '(dig-app[/\\]src[/\\]bin|diga[/\\]src)[/\\]' --fail-under-lines 80 --retries 2
      # nextest does not run doctests; run them explicitly so a doc example can never rot.
      - name: Run doctests
        run: cargo test --doc --workspace --all-features
      # Glibc floor gate test suite — tests the `scripts/check-glibc-floor.sh` gate that keeps
      # shipped Linux binaries runnable on the oldest supported distro (#1736). The test uses
      # stub readelf so it runs on any platform without needing real ELF files.
      - name: Run glibc floor gate tests
        run: bash scripts/tests/check-glibc-floor.test.sh

  # Split out of `test` (dig-app#336): a doc-link-hygiene failure used to surface as the
  # "Test + coverage" check going red, which sent readers to test output first even though no
  # test had failed -- two lanes lost a full round-trip to this on the same day. Its own named
  # check makes the red self-explaining. Reproduce locally with the exact RUSTDOCFLAGS below
  # before pushing (see the file-header comment).
  doc-lint:
    name: Doc-link hygiene (rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      # `--all-features` pulls in the default `tray` feature and its Linux GTK dependency.
      - name: Install tray build deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      # Doc-link hygiene is GATED (dig_ecosystem#2012 / #2056): deny the STABLE, high-value rustdoc lints
      # that catch REAL doc breakage -- a broken intra-doc link and a public-doc link to a private item
      # (exactly the #2005/#1977 regressions). Deliberately NOT blanket `-D warnings`: on the floating
      # `stable` toolchain that would also deny cosmetic, version-UNSTABLE lints -- e.g.
      # `redundant_explicit_links`, which fires on rustc 1.96 but not 1.97 -- and any FUTURE rustc lint, so
      # a toolchain roll-forward would red EVERY PR with no code change (#2056). Enumerating the lints keeps
      # the doc-quality value without that CI-stability foot-gun.
      - name: Check documentation builds (link-hygiene, gated)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc --no-deps --workspace --all-features

  # The ubuntu jobs above compile only the Linux `#[cfg(target_os = "linux")]` code, so the Windows +
  # macOS native confirmers (SIGN-3: Windows Hello / Touch ID FFI, `src/confirm/{windows,macos}.rs`)
  # would otherwise never be built or linted. These native runners compile, lint (-D warnings), and run
  # the per-OS unit tests so a platform backend can never rot undetected on the ubuntu-only gate.
  native-backends:
    name: Native confirmer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung test must go RED in an hour, not run to GitHub's six-hour ceiling and report
    # `cancelled` — which reads as "somebody superseded it" and is how dig_ecosystem#2705 stayed
    # invisible for a day. This job is not a required check, so a hang here shows only as
    # `mergeStateStatus=UNSTABLE`; a bounded job turns that silence into a signal.
    #
    # 60 and not 30: a healthy Windows run is genuinely slow. Successful runs before the hang took
    # 10m and 23m, `dig-app-core`'s integration tests include one that alone takes ~5m on Windows,
    # and a cold `Swatinem/rust-cache` adds a full cold compile on top. A ceiling tight enough to
    # clip a healthy cold-cache run would trade a hang for a flake, and a flaky non-required check
    # gets ignored exactly like the hang did. The hang this guards against ran for six hours, so an
    # hour still separates the two cases by a wide margin.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      # `dig-app-core` holds the per-OS confirmer; the tray shell's GUI stack is not needed to build it.
      - name: cargo clippy -D warnings (dig-app-core)
        run: cargo clippy -p dig-app-core --all-targets --all-features --locked -- -D warnings
      - name: cargo test (dig-app-core)
        run: cargo test -p dig-app-core --all-features --locked
      # dig-app#92: this platform's own `#[cfg]` items (e.g. the Windows Hello / Touch ID FFI)
      # are only visible to rustdoc when it runs ON that platform, so the ubuntu-only doc-lint
      # job above cannot catch a broken/private intra-doc link inside them. Same RUSTDOCFLAGS
      # as `doc-lint`, scoped to the crate this job already builds.
      - name: Check documentation builds (dig-app-core)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc --no-deps -p dig-app-core --all-features
      # The tray SHELL has per-OS code too, and until dig-app#86 none of it was built by any CI job:
      # the ubuntu gate runs `-p dig-app` but compiles no `cfg(target_os = "windows")` item, and this
      # job only ran `-p dig-app-core`. So `tray_popup`'s Win32 lookup, its `unsafe` callback, and the
      # pin that is supposed to shout when `tray-icon` renames its window class were all invisible —
      # a green board said nothing whatever about them, which is how a rescue that never ran shipped.
      - name: cargo clippy -D warnings (dig-app shell)
        if: runner.os == 'Windows'
        run: cargo clippy -p dig-app --all-targets --features tray --locked -- -D warnings
      - name: cargo test (dig-app shell)
        if: runner.os == 'Windows'
        run: cargo test -p dig-app --lib --features tray --locked
      - name: Check documentation builds (dig-app shell)
        if: runner.os == 'Windows'
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc --no-deps -p dig-app --features tray
