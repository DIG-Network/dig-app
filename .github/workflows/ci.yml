# PR quality gates for the dig-app Rust workspace: formatting, linting, tests, and a GATED
# coverage report (>=80% lines, CLAUDE.md §2.3/§2.4a). Runs on every PR to main and on pushes to
# main so the default branch stays green. Job `name:`s are stable — they are the required-check
# contexts wired on the protected branch.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege: CI only reads the checked-out repo (GHAS/CodeQL requirement).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The default `tray` feature links the desktop tray stack (GTK on Linux; NOT libxdo, see
      # dig_ecosystem#1753); install its
      # system dev libraries so `--all-features` compiles here. Runtime still degrades headless.
      - name: Install tray build deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The `linux-x64-headless` artifact is built with `--no-default-features`, a configuration NO other
  # gate compiles: `clippy` above runs `--all-features`, so a feature-gating break in the no-`tray`
  # build stayed invisible until a tag was already pushed and `release.yml` went red (v9.2.0 —
  # `Agent` was imported behind `#[cfg(feature = "tray")]` but used unconditionally). This job
  # mirrors the release flags from `build-binaries.yml` so that break fails on the PR instead.
  headless:
    name: Headless build (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      # No GTK install here, deliberately: a headless build that needs the tray's system libraries
      # is not headless, so leaving them out keeps this job honest about what it proves.
      - name: cargo clippy -D warnings (headless dig-app shell)
        run: cargo clippy --no-default-features --locked --package dig-app --bin dig-app -- -D warnings

  test:
    name: Test + coverage (>=80% lines, gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # The default `tray` feature links the desktop tray stack (GTK on Linux). NOT libxdo: it is
      # disabled in the workspace manifest, because a DT_NEEDED entry on `libxdo.so.3` killed the
      # shipped binary before `main` on stock Ubuntu (dig_ecosystem#1753).
      - name: Install tray build deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # `cargo llvm-cov nextest` runs the flaky-aware nextest runner UNDER coverage instrumentation
      # (one combined invocation — separate steps collect zero coverage). The gate fails the build
      # below the 80% line floor. The `dig-app` binaries are thin, largely GUI/event-loop shells
      # over `dig-app-core` (where all logic + its coverage lives, per the crate design), so they are
      # excluded from the line gate — chasing coverage of the platform event loop is not meaningful.
      - name: Run tests with 80% line-coverage gate
        run: cargo llvm-cov nextest --workspace --all-features --locked --ignore-filename-regex '(dig-app[/\\]src[/\\]bin|dign[/\\]src)[/\\]' --fail-under-lines 80 --retries 2
      # nextest does not run doctests; run them explicitly so a doc example can never rot.
      - name: Run doctests
        run: cargo test --doc --workspace --all-features
      # Doc-link hygiene is GATED (dig_ecosystem#2012 / #2056): deny the STABLE, high-value rustdoc lints
      # that catch REAL doc breakage — a broken intra-doc link and a public-doc link to a private item
      # (exactly the #2005/#1977 regressions). Deliberately NOT blanket `-D warnings`: on the floating
      # `stable` toolchain that would also deny cosmetic, version-UNSTABLE lints — e.g.
      # `redundant_explicit_links`, which fires on rustc 1.96 but not 1.97 — and any FUTURE rustc lint, so
      # a toolchain roll-forward would red EVERY PR with no code change (#2056). Enumerating the lints keeps
      # the doc-quality value without that CI-stability foot-gun.
      - name: Check documentation builds (link-hygiene, gated)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc --no-deps --workspace --all-features

  # The ubuntu jobs above compile only the Linux `#[cfg(target_os = "linux")]` code, so the Windows +
  # macOS native confirmers (SIGN-3: Windows Hello / Touch ID FFI, `src/confirm/{windows,macos}.rs`)
  # would otherwise never be built or linted. These native runners compile, lint (-D warnings), and run
  # the per-OS unit tests so a platform backend can never rot undetected on the ubuntu-only gate.
  native-backends:
    name: Native confirmer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
      # `dig-app-core` holds the per-OS confirmer; the tray shell's GUI stack is not needed to build it.
      - name: cargo clippy -D warnings (dig-app-core)
        run: cargo clippy -p dig-app-core --all-targets --all-features --locked -- -D warnings
      - name: cargo test (dig-app-core)
        run: cargo test -p dig-app-core --all-features --locked
      # The tray SHELL has per-OS code too, and until dig-app#86 none of it was built by any CI job:
      # the ubuntu gate runs `-p dig-app` but compiles no `cfg(target_os = "windows")` item, and this
      # job only ran `-p dig-app-core`. So `tray_popup`'s Win32 lookup, its `unsafe` callback, and the
      # pin that is supposed to shout when `tray-icon` renames its window class were all invisible —
      # a green board said nothing whatever about them, which is how a rescue that never ran shipped.
      - name: cargo clippy -D warnings (dig-app shell)
        if: runner.os == 'Windows'
        run: cargo clippy -p dig-app --all-targets --features tray --locked -- -D warnings
      - name: cargo test (dig-app shell)
        if: runner.os == 'Windows'
        run: cargo test -p dig-app --lib --features tray --locked
