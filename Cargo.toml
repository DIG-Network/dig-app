# dig-app — the DIG user app / identity hub (epic dig_ecosystem#908).
#
# A Cargo workspace mirroring the #908 form-factor split:
#   * `dig-app-core` — the HEADLESS per-user identity-agent LIBRARY (identity/keys/profiles/
#     wallet/storage/IPC/gateway). This is the real component; it degrades headless on a GUI-less
#     host. U3+ implement its modules.
#   * `dig-app`      — the branded tray/menu-bar shell binary built on the core.
#   * `diga`         — the DIG user CLI binary (U7), migrated from dig-node. Both binary crates are
#     thin entrypoints so all logic (and its test coverage) lives in the core library.
#
# The single workspace version is the source of truth for the release pipeline (the release
# workflows read `[workspace.package].version`).
[workspace]
resolver = "2"
members = ["crates/dig-app-core", "crates/dig-app", "crates/diga"]

[workspace.package]
version = "13.16.1"
edition = "2021"
rust-version = "1.75"
license = "GPL-2.0-only"
repository = "https://github.com/DIG-Network/dig-app"
authors = ["DIG Network"]

[workspace.dependencies]
dig-app-core = { path = "crates/dig-app-core" }
# Generates the variant enumeration behind `window_model::TabId::ALL` (dig_ecosystem#2358). A
# hand-written `[Self; N]` compiles happily when a variant is added to it and is silently absent
# from every sweep written over it — which is three of this crate's guards at once. A derive is the
# only thing stable Rust has that makes the list exhaustive by construction.
strum = { version = "0.26", features = ["derive"] }
# The `tracing` facade every module in this workspace emits events through. `dig-app-core` (and every
# other library crate) depends on ONLY this — never `dig-logging` directly — so the engine-agnostic
# core stays subscriber-agnostic; the `dig-app`/`diga` binary shells are the ones that install a
# subscriber (see `dig-logging` below), mirroring the dig-node split (dig-node-core: tracing only,
# dig-node-service: dig-logging + the init).
tracing = "0.1"
# The shared logging building block (dig_ecosystem#547/#934) — the ONE place `dig-app`/`diga` get
# their dual JSONL-file + human-stderr sink, per-OS log dir, EnvFilter precedence, and `logs` CLI
# verbs from, so the layout is byte-identical to dig-node/dig-dns/dig-updater. Sourced from crates.io
# (no git/path dep) per the ecosystem crates.io policy (#681).
dig-logging = "0.2"
# The ONE implementation of the mirror-collateral epoch arithmetic (dig_ecosystem#3173). dig-app
# consumes exactly one deliberately NON-consensus function from it — `apply_safety_margin`, which
# rounds up so a client-side margin can never leave a node a DIG base unit short of the requirement. Nothing
# in this app derives a requirement, a census or a controller signal; a second implementation of any
# of that arithmetic is a fork, which is why the crate is called rather than copied. Pure integer
# arithmetic with no DIG or Chia dependency, so it costs the app nothing to link.
dig-mirror-collateral = "0.3"
# The canonical dig-app ⇄ dig-node IPC session/signing contract (dig_ecosystem#1074/#1081). ONE
# ecosystem definition of the local IPC channel — the domain-separated message builders (app signs,
# engine verifies), frame bounds, the `control.session.*` wire types + `sign` callback, the seam
# traits + role-halves, and the APP-SIGN error taxonomy. dig-app-core consumes it as the CLIENT half
# so the app + engine (dig-node, #1080) can never drift. LEAF crate (no `dig-*` deps); from crates.io
# per the ecosystem crates.io policy (#681). The app-specific concrete signer/policy impls stay here.
dig-ipc-protocol = "0.3"
# The canonical client ⇄ dig-node CONTROL method catalog (dig_ecosystem#1152): the stable
# `control.*` wire names, typed params/results, the error taxonomy, and the JSON-RPC envelope they
# ride in. dig-app-core consumes it as the CLIENT half so the app can never drift from the surface
# dig-node dispatches. Transport-agnostic by design — `crate::control` supplies the loopback HTTP
# transport the node actually answers on.
dig-node-control-interface = "0.24"
# The canonical blockchain→app event CONTRACT (dig_ecosystem#1067). The ONE definition of the
# WalletEvent taxonomy + EventKind filter + Cursor/EmittedEvent envelope + the CatchUp/filter_events
# shape the app subscribes over. dig-app imports these types here — NEVER re-declares them (the
# contract is canonical + byte-stable; re-declaring drifts the ecosystem, per #1008's design rule).
# It re-exports `enumset` so the app names `EnumSet<EventKind>` without a separate enumset pin.
dig-events-protocol = "0.1"
# Async trait objects for the transport-injected event-feed seam (mirrors the wallet-backend client
# seam's own `async_trait` usage), so the concrete IPC feed drops in behind a boxed trait.
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Deterministic CSPRNG for tests only — pins seeded identity keys so key-management tests are
# reproducible (never used in production code, which uses the OS CSPRNG).
rand_chacha = "0.3"
# Key management (U4). At-rest sealing is delegated to the audited dig-keystore `opaque` module
# (DIGOP1 = AES-256-GCM + Argon2id); the identity key is the dig-identity slot-`0x0010` BLS12-381 G1
# key (v2 model) sourced through dig-identity's own `bls` primitives (chia-bls / blst — never
# hand-rolled), and the OS credential store is reached through the cross-platform `keyring` crate. The
# single G1 key does BOTH signing (G2 AugScheme) and sealing (G1 ECDH), so the v1 X25519 slot `0x0011`
# is retired — no separate encryption key, no dalek crates. NONE of the crypto is hand-rolled.
# 0.13 is the HARDWARE-CAPABLE line (dig-app#280). Two guards changed direction across the 0.9→0.13
# range, both fail-closed: an undeterminable existence probe now REFUSES rather than answering a
# confident `false` (0.11.0), and the `exists`-then-`write` mint path became an atomic `write_new`.
# Both are why the pin moves as a set with `dig-session`/`dig-account` below.
dig-keystore = "0.13"
# The session/keystore facade (dig_ecosystem#1024 Phase 2): the master-HD custody model (#997). One
# `UnlockedMasterSeed` per app holds the single master seed; per-profile identity + DEK derive from it
# by profile index (`profile_public_key`/`profile_sign`/`profile_derive_symmetric_key`), and the DEK
# is byte-identical to the frozen `dig_constants` HKDF construction (§5.1 at-rest back-compat). dig-app
# routes ALL identity signing + at-rest DEK derivation through this facade — never a local re-derive.
# 0.9 is the dig-keystore 0.13 adoption (dig-app#280). It MUST match the `dig-keystore` pin above:
# cargo treats 0.9 and 0.13 as distinct crates, so a `KeychainBackend` handed across this seam from a
# differently-versioned dig-keystore is a different trait and does not compile — the exact
# `MemoryBackend: dig_session::KeychainBackend is not satisfied` error dig-account hit before its own
# uplift. 0.9 also replaced this crate's `exists`-then-`write` mint with an atomic `write_new`, so any
# caller-side presence pre-check is now a fast path rather than the authority.
dig-session = "0.9"
# The custody OBJECT MODEL + crypto crate (#1497/#1509): AccountStore/AccountSession/UnlockedAccount,
# keystore at-rest crypto, AuthPolicy verification + KDF unlock, per-profile identity signing
# (ProfileSigner: dig_ipc_protocol::SessionSigner), the wallet money-path (WalletOps), DEK, DID/dig-store
# mint. dig-app is the THIN HARNESS consumer (#1509): it implements + injects the AuthProvider ceremony
# and wires ProfileSigner into the IPC sign callback. It does NOT supply the custody gate — 0.5.0
# removed the `SpendAuthorizer` trait dig-app used to inject (its implementation authorized everything),
# so the crate's own `PolicyAuthorizer` is now mechanically the only thing that can permit a spend.
# Consumed as the published crates.io release (release-first, §4.1), never a git source (§3.6
# all-crates rule).
# 0.18 for `ProfileEditor::publish_profile` (dig_ecosystem#3041): the ONE operation that writes a
# profile body without reading the old one first, which is the only way a profile whose body is gone
# can be given a new one at all.
# 0.20 for `ProfileMelter` (dig-app#205): profile DELETION, which is expressible nowhere else. It
# melts both singletons in ONE gated bundle and derives its `DeletionPreview` from that same built
# plan, so the sentence a person consents to is the spend that gets signed.
# 0.26 is the dig-keystore 0.13 / dig-session 0.9 adoption (dig-app#280), pinned in lockstep with
# both above for the same one-definition reason. It also carries the three-valued existence read: a
# probe that cannot determine whether the custody root is there now REFUSES instead of reporting
# "absent" — see `account::boot::account_exists`, which must NOT flatten that back to `false`.
dig-account = "0.26"
# The per-profile X25519 sealing keypair type (`UnlockedAccount::profile_sealing_key`) crosses the
# dig-account API as an `x25519_dalek::StaticSecret`, and the DIGCHAT1 seal/unseal (`identity.*`,
# SPEC §5.6) does ephemeral-static X25519 DH with it. Pinned to the SAME major line dig-account
# resolves ("2") so the `StaticSecret`/`PublicKey` types UNIFY to one definition — Cargo coalesces a
# single crate+major, so there is never a drifted second copy of the type. No hand-rolled curve math.
x25519-dalek = "2"
# The relay auth token for WalletConnect (dig-app#225). The relay admits a wallet only on an
# `EdDSA` JWT issued by a `did:key` ed25519 identity, so ed25519 is a protocol requirement rather
# than a choice; the key is EPHEMERAL, minted per connection, and can authorise nothing on chain.
# Same dalek family as `x25519-dalek` above. `bs58` encodes the `did:key` multibase form - the one
# encoding in that DID, and never used for anything else here.
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
# XChaCha20-Poly1305, the AEAD of the DIGCHAT1 suite-1 envelope (SPEC §4.2). RustCrypto, the same
# family as the `sha2`/`hmac`/`hkdf` deps already in the graph; the 24-byte extended nonce is drawn at
# random per envelope so no counter is needed. Never hand-rolled (NC-1).
chacha20poly1305 = "0.10"
# The Chia `Network` selector the dig-account money signer is parameterised by
# (`WalletOps::money_signer(network)` → `dig_wallet_backend::types::Network`). dig-app names ONLY this
# selector type from the wallet backend — it does NOT use its client seam (the app signs through
# dig-account's canonical money signer, ratified Option A #1024). Pinned to the same 0.28 line
# dig-account 0.18 resolves so the `Network` type is one shared definition, never a drifted copy: two
# copies of this enum in the graph are a type error at the signer call, not a silent drift.
dig-wallet-backend = "0.31"
# The ecosystem's single source of truth for shared byte-frozen constants (dig_ecosystem#681/§4.1).
# dig-app consumes the profile-DEK at-rest byte contract from here — DEK_SALT, IDENTITY_IKM_VERSION,
# PROFILE_DEK_LABEL, SYMMETRIC_KEY_LEN — so the derivation can never drift from the byte-identical
# copy dig-session's `derive_symmetric_key` already sources from the same crate (§5.1 back-compat).
# 0.11 under §2.4b (dig-app#241). It is deliberately NEWER than the 0.10 dig-account 0.21 resolves,
# and that is safe here for a MEASURED reason rather than a hoped-for one: the four values dig-app
# reads across the seam are byte-identical between the two published versions — DEK_SALT
# (`dig-app:dek-salt:v1`), IDENTITY_IKM_VERSION (2), PROFILE_DEK_LABEL, SYMMETRIC_KEY_LEN, plus
# DIG_ASSET_ID — so the profile DEK and the sealing key derive identically on either copy.
# `crates/dig-app-core/tests/dek_byte_contract.rs` asserts those literals, so a future version that
# moves one fails the suite instead of silently re-keying every profile at rest.
#
# Be precise about what this does NOT buy: the graph carries BOTH 0.10 and 0.11, because
# dig-account 0.21 / dig-session 0.7 / dig-wallet-backend 0.29 — all at their own latest — still
# resolve 0.10 internally. Those copies never appear in a public signature dig-app names (they
# cannot: the workspace compiles, and a crossed `dig_constants` type would not), so they cannot
# drift a byte contract we participate in — but "there is ONE dig-constants in the graph" is false
# and cannot be made true from dig-app. It needs the upstream facades to adopt 0.11 first
# (dig_ecosystem#2497).
dig-constants = "0.11"
# The DPB profile-body format authority (dig_ecosystem#3027). dig-account's content seam speaks
# `(slot id, encoded value)` PAIRS while the artifact dig-app persists is canonical DPB BYTES, so
# something must decode one into the other -- and that framing is a byte contract with golden
# vectors. Re-deriving it inside dig-app would be a second implementation of a byte contract
# (Appendix B), so the crate that owns the format does the decoding, in ONE private function
# (`profile_edit::adapter::slots_of`). No type from it crosses a dig-app public API. Pinned to the
# line dig-account 0.16 itself resolves, so `VerifiedBody` here is the same definition the crate
# verifies against rather than a silently-drifted second copy.
dig-social-profile = "0.7"
# The dig-store singleton driver: hydrates a store's tip spend into the metadata whose `root_hash`
# IS the chain-anchored profile root (dig_ecosystem#3008). Needed to look up SOMEBODY ELSE'S profile
# (`profile_view::chain`), which cannot go through `dig_account::edit::read_profile`: that takes a
# `ProfileAnchor`, whose only constructor requires both halves of a mint THIS machine performed, so
# a stranger's lookup would have to fabricate one. 0.8 under §2.4b (dig-app#241), two minors up from
# the 0.6 dig-account 0.21 and dig-store 0.7 still resolve. No `dig_merkle` type crosses into
# dig-account here — the metadata is parsed and consumed inside `profile_view::chain` — so the two
# copies cannot meet in a signature, which is why the uplift needed no call-site adaptation.
dig-merkle = "0.9"
# The ecosystem's canonical Chia OFFERS expert crate (dig_ecosystem#3077). It is pure: it never holds
# a key, never signs and never broadcasts — it decodes/summarizes an `offer1…` string and builds the
# taker's UNSIGNED coin spends, which dig-app then hands to dig-account's custody gate for signing and
# to the node for broadcast. That split is exactly the §908 boundary, so the offer path needs no
# hand-rolled spend anywhere (Appendix B: reuse the crate, never reimplement a spend shape).
# Pinned to the 0.36.1/0.34 chia line dig-account 0.16 resolves, so the `CoinSpend`/`SpendBundle`
# types crossing the two seams are ONE definition rather than a silently-drifted second copy.
dig-offers = "0.3"
# `dig-offers` names `IndexMap` in its PUBLIC API (`OfferedSide::owner_keys`, `TakerFunds::owner_keys`),
# so constructing a take is impossible without it. Pinned to the same major line dig-offers resolves so
# the map crossing that seam is one definition, not a drifted copy.
indexmap = "2"
# The BIP-39 recovery phrase (dig_ecosystem#1752, the #1500 derived account model): the 24-word
# mnemonic that IS an account's portable custody root. Standard, audited wordlist + checksum + PBKDF2
# implementation — never hand-rolled. `zeroize` wipes the crate's own internal buffers; `rand` supplies
# the OS CSPRNG draw for a fresh phrase. English only (the ecosystem's phrase language), so the other
# wordlists are not compiled in.
bip39 = { version = "2", default-features = false, features = ["std", "zeroize", "rand"] }
# The one `flock` call behind the unix half of `single_instance` (dig_ecosystem#1831). std has no
# file-locking API, and the alternative crates wrap the same syscall in more surface than one call
# needs; `libc` is already in the tree transitively via every unix dependency here.
libc = "0.2"
hkdf = "0.12"
# HMAC-SHA1, the MAC RFC 6238 TOTP is defined over (`account::second_factor::totp`). SHA-1 is used here
# ONLY as the keyed MAC every shipping authenticator app implements — never as a collision-resistant
# hash — so its collision weakness does not apply. RustCrypto, the same family as the `sha2`/`hmac`
# deps already in the graph; no hand-rolled crypto.
sha1 = "0.10"
# The QR encoder for the two-factor enrolment window (dig_ecosystem#1849).
#
# #1840 shipped 2FA with NO QR, on the explicit ground that a QR encoder is a new dependency inside a
# binary that holds the user's master seed. The user has since asked for the QR directly, so the
# convenience is wanted — but the supply-chain argument still decides WHICH encoder, and the bar it
# sets is severe: a QR is pure computation over a byte string, so anything reaching for I/O, a
# network, `unsafe`, or a dependency tree has been mis-chosen.
#
# `qrcodegen` is Nayuki's reference generator, the implementation the other language ports are checked
# against. It has **zero** transitive dependencies (`cargo tree` shows one node), the published crate
# is 15 KB of source, and it is `#![forbid(unsafe_code)]` — so taking it adds exactly one auditable
# unit to the graph rather than a subtree. Vendoring a single file was priced against it and lost:
# vendoring buys nothing here (a zero-dep crate IS the vendored file, with provenance and a version to
# audit) while making US responsible for Reed-Solomon and mask-pattern selection, where a silent
# arithmetic error renders a QR that scans into the WRONG secret.
#
# It declares no features and no optional deps, so there is no configuration surface to get wrong, and
# nothing in it can open a file, resolve a name or spawn a thread — which is the property that matters
# for a binary holding a master seed.
qrcodegen = "1.8"
# sha256 — the per-profile DEK HKDF (U4) and the per-profile AppData directory key (U5, a hash of the
# profile DID). Pinned to the ecosystem 0.10 line so the hash byte-agrees with dig-identity's own
# slot-key derivation.
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
# The bitmap decoder/encoder behind profile-image intake (dig_ecosystem#3010). `default-features =
# false` is load-bearing, not tidiness: the default feature set enables a dozen decoders (TIFF, WebP,
# GIF, DDS, TGA, farbfeld, ...) and every decoder is parser attack surface reachable from a body an
# untrusted peer sent us. Profile images are PNG or JPEG, so those are the only two compiled in — a
# format we cannot decode cannot be exploited through us. Chosen over hand-rolling because the resize
# filters and the aspect arithmetic are exactly where a hand-rolled version goes subtly wrong.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The OS credential store abstraction — used as the custody PRIMARY on Windows (Credential Manager)
# and macOS (Keychain) ONLY, because those backends gate access per-application. Linux is
# deliberately EXCLUDED: the kernel keyutils session keyring is readable by any same-UID process in
# the session (no per-app ACL) AND is non-persistent across reboot/logout, so it is unsafe as a
# custody primary — on Linux the passphrase-sealed file is the primary instead (see the `keystore`
# module). `keyring` is a TARGET-SPECIFIC dependency (the crate manifest gates it to windows/macos),
# so it is never compiled on Linux and pulls no dbus/libsecret system libraries there.
# `default-features = false` + only the per-OS native backends keeps CI builds free of system libs.
keyring = { version = "3", default-features = false, features = [
    "windows-native",
    "apple-native",
] }
# The canonical DIG decentralized-identity profile FORMAT (dig_ecosystem#771): the `did:chia:` DID +
# the additive sparse-merkle-tree of profile slots. dig-app CONSUMES this format for profile
# metadata (never reinvents the SMT/slots) AND its BLS12-381 G1/G2 identity-key primitives (the v2
# key model — one slot-`0x0010` G1 key for sign + seal, X25519 slot `0x0011` retired). Sourced from
# crates.io per the ecosystem crates.io policy (#681). 0.7 under §2.4b (dig-app#241): it is the line
# dig-social-profile 0.6 already resolves, so this uplift UNIFIES dig-app with that facade rather
# than splitting it — what remains split is dig-account 0.21's own internal 0.6, which cannot be
# fixed from here. As with `dig-constants` below, those copies never surface in a signature dig-app
# names (dig_ecosystem#2497). The line carries the per-profile-index derivation
# (`derive_identity_sk_at`) the master-HD multi-profile model (#997) needs, and the default-on `bls`
# feature carries the key primitives dig-app's session signs with.
dig-identity = { version = "0.7.1", features = ["bls"] }
# The canonical `did:chia:` bech32m encoding of a singleton launcher id. dig-app names it in ONE
# place: the profile-registry test fixtures, which must produce the same DID string dig-account's own
# `ProfileAnchor` validator recomputes — a hand-written literal there is refused, correctly, because a
# DID that does not belong to its launcher id is exactly the forgery that check exists to catch.
# 0.7 under §2.4b (dig-app#241) — the line dig-account 0.21 itself depends on directly, so both
# sides encode identically; the 0.6 also in the graph arrives only behind dig-social-profile 0.6.
dig-did = "0.8"
# Lowercase-hex encoding of public keys + the DID directory hash in the human-readable registry.
hex = "0.4"
# chip35-dl-coin is deliberately NOT a dependency of this workspace, and the reason has CHANGED —
# read which one applies before acting on it (dig_ecosystem#2560, updated by #2396).
#
# The old reason was a VERSION WALL: chip35-dl-coin's only published release pinned chia-* 0.26 /
# chia-sdk-* 0.30 against dig-account's 0.36.1 / 0.34, so its `CoinSpend` was a different Rust type
# and a chip35-built spend could not be handed to dig-account at all. That wall is GONE —
# chip35-dl-coin 0.10.0 published on 0.36.1 / 0.34, the same line dig-account resolves. Do not cite
# it as a blocker; #2396 shipped the $DIG spend path over it.
#
# The reason that REMAINS is simply that nothing here calls it. $DIG sending goes through
# `dig_account::WalletOps::build_dig_transfer` (dig-account's own CAT builder, `wallet/cat_transfer.rs`),
# which dig-app already depends on — so declaring chip35 as well would pull a whole additional SDK
# surface into the shipped tray binary for zero call sites. Add it only when a spend shape dig-account
# genuinely does not build appears here, and never as a second route to one it does: two builders for
# one spend is the drifted-second-copy hazard this comment block exists to prevent.
#
# The Chia type line dig-account 0.10 resolves (dig_ecosystem#2560), so every chia type dig-app
# passes across the dig-account seam is ONE definition rather than a silently-drifted second copy.
chia-bls = "0.36.1"
chia-protocol = "0.36.1"
# The ONE canonical chain-READ seam (reads only — it deliberately cannot broadcast). dig-account's
# mint is generic over it, so the DID mint reads coins, peak height and its own confirmation through
# this trait and dig-app can hand it any provider without dig-account knowing which.
# `lineage-walk` is OFF by default and is what ships `walk_singleton_lineage` — the ecosystem's one
# hardened launcher-to-tip singleton walk, which `chain::ControlChainSource::resolve_singleton_lineage`
# delegates to (dig_ecosystem#2572). Without it that read cannot be served and a profile mint can push
# its DID half and never launch its store. The feature's extra deps (chia-puzzle-types/-puzzles,
# chia-sdk-driver/-types, clvm-traits/-utils/clvmr) are all already in this graph at the same versions,
# so enabling it adds no new crate — only the walk.
dig-chainsource-interface = { version = "0.3", features = ["lineage-walk"] }
chia-puzzle-types = "0.36.1"
chia-sdk-driver = "0.36"
chia-sdk-signer = "0.36"
# The in-process Chia consensus validator (dev-only). The DID-mint tests run their bundle through the
# same CLVM + BLS verification a full node runs, so a mint that confirms in them is one whose puzzles
# and signatures are genuinely correct — not one a hand-written double agreed with.
chia-sdk-test = "0.36"
# TESTNET11 consensus constants for that validator: a bundle signed under mainnet's AGG_SIG_ME domain
# verifies nowhere else, so the fixture must sign under the constants it validates against.
# The FACADE the chia-sdk-* sub-crates are re-exported through, and the crate whose feature set the
# whole 0.34 line unifies on. Its features MUST match what dig-account 0.10 asks for (`chip-0035`)
# rather than fight Cargo's feature unification: dig-app previously set `default-features = false`,
# which only removed features from a graph dig-account then re-added, so the flag bought nothing while
# making the resolved feature set harder to read than the one line that now states it.
chia-wallet-sdk = { version = "0.36", features = ["chip-0035"] }
chia-sdk-types = "0.36"
chia-traits = "0.36.1"
clvm-traits = "0.36.1"
clvmr = "0.16"
hex-literal = "0.4"
# Canonical `xch1…`/`did:chia:` bech32m address encoding (wallet receive address; also the
# profile-management test helper).
chia-sdk-utils = "0.36"
# Cross-platform desktop tray / menu-bar shell (Windows system tray · macOS menu-bar · Linux
# AppIndicator/StatusNotifier). `tao` provides the platform event loop the tray icon needs to pump
# its events; the native menu comes from `tray-icon`'s re-exported `muda`. The tray is the `dig-app`
# crate's default `tray` feature; disable it (`--no-default-features`) to build the pure headless
# agent with no desktop stack.
#
# `default-features = false` drops `tray-icon`'s only default feature, `libxdo`, which it forwards to
# `muda`. `muda` uses libxdo in exactly one place: synthesizing ctrl+c/x/v/a keystrokes so the
# PREDEFINED Copy/Cut/Paste/SelectAll menu items work on Linux. Our menu has none of them, so the
# feature bought nothing while adding `libxdo.so.3` to the binary's DT_NEEDED list — a library stock
# Ubuntu does not ship, so the loader killed dig-app with rc=127 before `main` and no runtime
# fallback could ever run (dig_ecosystem#1753). Pinned by `tests/linux_runtime_deps.rs` in the
# `dig-app` crate. The Linux tray still needs the GTK 3 runtime, which is inherent to
# AppIndicator/GTK menus rather than an unused extra; see `README.md`.
tray-icon = { version = "0.23", default-features = false }
tao = "0.30"
# The branded prompt GUI (dig_ecosystem#2038) — the ONE renderer every DIG consent/notice/input
# window is drawn with, on all three platforms, replacing the Win32 GDI dialog, the macOS `NSAlert`
# and the Linux `zenity`/`kdialog` subprocess.
#
# `egui` was chosen over a webview (wry/Tauri, which dig-installer's GUI uses) on a MEASURED
# comparison, not a preference — the numbers are in #2038. Two properties decided it:
#
#   1. **The injection class cannot occur.** Every value these windows display is
#      attacker-influenced, and `egui::Painter::text` rasterises glyphs — there is no markup
#      interpreter in the process to opt out of. A webview moves that from "impossible" to
#      "defended by an escape call at every render site, forever", inside the window that authorises
#      spending real mainnet funds; the prototype showed one missing call forges a complete
#      "verified by DIG" consent panel, and that a script-oriented CSP does not stop it (the forgery
#      is markup plus inline styles).
#   2. **The runtime shape suits a tray daemon.** ~90 ms to first paint in ONE process and ~55 MB
#      private, against ~410 ms across SEVEN processes and ~190 MB private for the webview.
#
# The cost taken knowingly is a second design system in Rust (hub.dig.net's tokens, ported in
# `confirm::gui::theme`) — a cost the user accepted explicitly rather than one that slipped in.
#
# `eframe` supplies the window + GL surface; `default-features = false` drops the `wgpu`,
# `persistence` and `accesskit` extras and keeps `glow` (OpenGL), which is present wherever a
# desktop session is. `x11` + `wayland` mirror the dual-stack the Linux tray already needs.
#
# DROPPING `accesskit` IS A KNOWN, RECORDED ACCESSIBILITY GAP (dig_ecosystem#1832). Without it these
# windows expose no accessibility tree, so a screen reader cannot announce the consent copy or name
# the buttons on the window that authorises spending real funds — and a person who relies on one has
# no way to read what they are approving. Contrast, focus order and explicit focus tracking are all
# pinned by tests (`confirm::gui::theme`, `confirm::gui::window`); the tree is what is missing.
#
# It is not enabled here as a drive-by: `accesskit` adds a platform-adapter surface, and it is a UI
# automation interface inside a custody-holding, GUI-subsystem binary — an automation client can read
# and, on some platforms, ACT on the controls of a spend-authorisation window. That is a threat-model
# question about the consent boundary, not a feature-flag question, so it needs a decider and a
# security look rather than one lane's judgement. Recorded here, next to the line that causes it, so
# it cannot be rediscovered as a surprise.
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11"] }
# Pinned to the line `eframe` 0.31 resolves so the EventLoopBuilder the `with_any_thread`
# extension traits are applied to is the SAME type eframe builds the window from.
winit = "0.30"
# The system's own "choose a file" dialog, for the profile editor's picture fields
# (dig_ecosystem#3028). Drag-and-drop arrives free through `eframe`, but a drop-only affordance is a
# dead end for anyone who cannot drag — `professional-ui`'s never-trap rule — so a browse control is
# not optional and egui has no dialog of its own.
#
# `default-features = false` drops the async executor and the GTK3 backend: the Linux path is
# `xdg-portal`, which talks to the desktop's own file chooser over D-Bus and pulls in no toolkit.
# Windows and macOS call their native APIs with no extra graph either way.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# Decoder for the embedded DIG brand mark the tray paints (`dig-app::brand`). This is NOT a new
# dependency for the tray stack: `tray-icon` and `muda` already depend on `png` on Linux and macOS to
# load their own icons, so on those targets it is a graph we are already carrying, and it is a small
# pure-Rust decoder on Windows. Declared optional and forwarded from the `dig-app` crate's `tray`
# feature, so a `--no-default-features` headless build carries neither the mark nor a decoder.
png = "0.17"
# Only a dev-dependency, and only to BUILD an attack fixture: the iCCP decompression-bomb
# regression needs a real zlib stream whose decompressed size dwarfs its compressed size, and
# hand-rolling deflate to make one would be a second bug surface in the test itself.
flate2 = "1"
# APP-SIGN loopback identity channel (SIGN-1, dig_ecosystem#950, SPEC §5.6). The extension↔dig-app
# paired WebSocket server lives in `dig-app-core::loopback`, so the async runtime + WS + HMAC + uuid
# deps are declared here and consumed there. `tokio` drives the loopback listeners; `tokio-tungstenite`
# speaks the WebSocket JSON-RPC wire; `futures-util` supplies the Stream/Sink combinators; `hmac`
# provides the per-frame pairing-token MAC with a CONSTANT-TIME `verify_slice` (never a hand-rolled
# byte compare); `uuid` mints the opaque `pairing_id`. No hand-rolled crypto — the MAC is RustCrypto
# `hmac` over `sha2` (already a workspace dep).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
# The loopback listener needs no TLS (it is loopback), but the WalletConnect relay is a public
# `wss://` endpoint, so the `rustls` feature is REQUIRED or `connect_async` fails at runtime with
# "TLS support not compiled in" - a failure no compile-time gate can catch. `webpki-roots` rather
# than the OS trust store so the relay's certificate chain validates identically on every platform
# the tray ships to, including the headless Linux build.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }

# Per-OS native confirm window + biometric (SIGN-3, dig_ecosystem#950, SPEC §5.6.5). Each is a
# TARGET-SPECIFIC dependency gated in the crate manifest, so it is compiled ONLY on its own platform
# and never taxes the other builds. On Windows the `windows` crate provides the WinRT
# `UserConsentVerifier` (Windows Hello) + the Win32 `MessageBoxW` foreground consent window. On macOS
# `objc2` + AppKit draw the floating `NSAlert` and `objc2-local-authentication` drives Touch ID via
# `LAContext`; `block2` bridges the async `evaluatePolicy` reply block to a blocking call. Linux uses
# no native crate — it drives the desktop dialog helper + polkit `pkcheck` as subprocesses.
windows = { version = "0.58", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    # `GetTickCount`, the other half of `GetLastInputInfo`: the idle time the activity gate reads
    # (dig-app#312) is the difference between the two tick counts, so the reading needs both.
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    # The native input window (dig_ecosystem#1798) needs `SetFocus` to put the caret in the field it just
    # created — a window that opens with no focus makes the user click before they can type.
    "Win32_UI_Input_KeyboardAndMouse",
    # `EM_SETPASSWORDCHAR` / `BM_GETCHECK` for the reveal-while-typing checkbox (SPEC §3.1d).
    "Win32_UI_Controls",
    # `GetDpiForMonitor`/`MDT_EFFECTIVE_DPI` (dig_ecosystem#1832): this process is DPI-AWARE, because tao
    # sets per-monitor awareness when it builds the tray, so Windows does NOT scale our hand-built windows
    # for us. Without reading the real monitor DPI every dialog renders at a fraction of its intended
    # physical size on a scaled display.
    "Win32_UI_HiDpi",
    # `AttachConsole`/`SetStdHandle` (dig_ecosystem#1797): a GUI-subsystem process has no console, so
    # `dig-app --version` — which the update beacon health-gates on — must attach to its parent's. Opening
    # `CONOUT$` to re-point the standard handles is a `CreateFileW`, hence the file-system feature.
    "Win32_System_Console",
    # `CREATE_NO_WINDOW` (dig_ecosystem#2311): this GUI-subsystem process spawns console binaries
    # (`dig-updater status --json`, the clipboard helpers), and without that flag Windows allocates a
    # console for each one and paints a window for as long as it lives.
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    # `CreateNamedPipeW`/`ConnectNamedPipe` — the per-user `diga` CLI lane (dig_ecosystem#908). The
    # pipe is created under an EXPLICIT, protected, owner-only DACL. A NULL security descriptor MUST
    # NOT be used: it grants `Everyone` and `ANONYMOUS LOGON` `FILE_GENERIC_READ` on a pipe, so the
    # boundary the lane rests on is the DACL that `cli_session::windows_security` builds, never a
    # default. Adding a Windows feature here is not a reason to relax that.
    "Win32_System_Pipes",
    # `ConnectNamedPipe` takes an `OVERLAPPED`, which lives in the I/O sub-namespace.
    "Win32_System_IO",
    # `CreateFileW`'s `SECURITY_ATTRIBUTES` parameter lives here, so the file-system feature needs it.
    "Win32_Security",
    # The owner-only ACL on the recovery-phrase backup (dig_ecosystem#1965). Windows honours no mode
    # bits, so `0600` has to be spelled as a DACL: `SetEntriesInAclW` builds the single-entry list and
    # `SetSecurityInfo` applies it, both of which live in the Authorization sub-namespace.
    "Win32_Security_Authorization",
    # `OpenProcessToken` — the calling user's own SID is read from the process token, because the one
    # ACE in that DACL has to name somebody and it is always "whoever is running this".
    "Win32_System_Threading",
    # `SECURITY_DESCRIPTOR_REVISION`, the version stamp `InitializeSecurityDescriptor` demands.
    "Win32_System_SystemServices",
    # `GetSaveFileNameW` — the native save dialog the recovery-phrase backup opens so the user picks the
    # destination rather than being handed a fixed one (dig_ecosystem#1966). Preferred over the COM
    # `IFileSaveDialog`, which wants a single-threaded apartment; this process puts threads into the MTA
    # for WinRT (#1926). Rationale in `secret_file::picker`.
    "Win32_UI_Controls_Dialogs",
    # `RoInitialize` (dig_ecosystem#1926): the thread that raises the Windows Hello prompt is spawned by
    # us and belongs to no apartment, so it joins the MTA before activating a WinRT class.
    "Win32_System_WinRT",
    # The native funds-received toast (dig_ecosystem#2548). `ToastNotificationManager` +
    # `ToastNotification` live in `UI_Notifications` and take their payload as an `XmlDocument` from
    # `Data_Xml_Dom`. This is the ONE platform with no notification command to shell out to, so it is
    # the one place the notification API is called in-process rather than as a subprocess.
    "UI_Notifications",
    "Data_Xml_Dom",
    # An UNPACKAGED Win32 process has no package identity, so a toast has nothing to be attributed to
    # and is silently dropped. The documented substitute is an AppUserModelID on a Start Menu
    # shortcut, which needs `IShellLink` (`Win32_UI_Shell`) plus the property store that carries the
    # id (`Win32_UI_Shell_PropertiesSystem`), created through COM (`Win32_System_Com`) and written by
    # `IPersistFile`. `Win32_System_Com_StructuredStorage` is `PropVariantClear`, which returns the
    # id string's COM-allocated buffer after the store has copied it.
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSError",
    "NSNotification",
    "NSDistributedNotificationCenter",
    "NSOperation",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    # The native input window's accessory field (dig_ecosystem#1798): a recovery phrase is typed into an
    # echoing `NSTextField`, a passphrase into a masked `NSSecureTextField`. An `NSAlert` accessory view is
    # how macOS takes typed input in the same window type every other DIG prompt already uses.
    "NSTextField",
    "NSSecureTextField",
] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"
# libdispatch binding — hops the AppKit confirm window to the main thread (`run_on_main`) since the
# loopback server calls the confirmer from a worker task but AppKit is main-thread-only.
dispatch2 = "0.3"

