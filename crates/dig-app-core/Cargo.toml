# The headless per-user identity-agent CORE (epic dig_ecosystem#908). Everything identity-specific
# lives here — key management, DID/profiles, wallet host, per-user encrypted AppData, the
# identity-authenticated IPC session to the engine, and the CLI/RPC gateway. The tray/CLI binaries
# in the sibling `dig-app` crate are thin shells over this library, so all logic + its test coverage
# is centralized here.
#
# U1 (this WU) delivers the module skeleton + the small set of pure, fully-tested helpers the
# architecture needs day one (form-factor detection, per-OS AppData paths, IPC channel paths). The
# security-critical subsystems (keystore/profiles/session) are doc-commented stubs U4/U5/U6 implement
# to the SPEC.
[package]
name = "dig-app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The DIG user-app identity-agent core: key management, DID/profiles, wallet, per-user encrypted AppData, identity-authenticated engine IPC, and the CLI/RPC gateway. The identity half of the engine/identity split (dig_ecosystem#908)."

[features]
# The branded prompt GUI (dig_ecosystem#2038). ON by default, because drawing consent is what the
# app does; a `--no-default-features` build is the HEADLESS agent, which cannot prompt at all and
# therefore fails closed on every prompt (`HeadlessConfirmer`).
#
# There is deliberately no "fall back to the old native dialogs" path behind this flag. Two drawing
# systems where a caller cannot tell which it will get is exactly what #2038 set out to remove, so a
# build either has the one GUI or has no prompt surface.
default = ["gui"]
gui = ["dep:egui", "dep:eframe", "dep:winit", "dep:png"]

[dependencies]
thiserror.workspace = true
# The branded prompt GUI (#2038) — see the workspace manifest for why egui rather than a webview.
egui = { workspace = true, optional = true }
# Decodes the embedded window mark (dig_ecosystem#2340). Same decoder the tray uses, so the two
# surfaces cannot disagree about what the brand looks like.
png = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }
# The `with_any_thread` extension traits. Prompts are drawn on a dedicated thread (never the
# main one, which the tray owns), and only winit's per-platform traits can permit that.
winit = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
# `EnumIter` on `window_model::TabId` — see the workspace manifest for why a derive rather than a
# hand-written array.
strum.workspace = true
# The logging FACADE (#934) every module below emits lifecycle/diagnostic events through. This crate
# never depends on `dig-logging` itself — installing a subscriber is a process-wide decision that
# belongs to the `dig-app`/`dign` binary shells (see the workspace manifest for why).
tracing.workspace = true
# Key management (U4) — see the workspace manifest for why each is chosen. No hand-rolled crypto.
dig-keystore.workspace = true
# The master-HD session facade (#1024 Phase 2 / #997): the single `UnlockedMasterSeed` every identity
# + per-profile DEK derives from. All at-rest DEK derivation + identity signing routes through it.
dig-session.workspace = true
# The custody OBJECT MODEL + crypto crate (#1497/#1509). dig-app is the THIN HARNESS consumer: it
# implements + injects AuthProvider + SpendAuthorizer and wires ProfileSigner (a SessionSigner) into
# the IPC sign callback. All account crypto/derivation/unlock-policy lives in dig-account, never here.
dig-account.workspace = true
# Only the Chia `Network` selector the dig-account money signer takes (`WalletOps::money_signer`).
# dig-app does NOT use the wallet-backend client seam — the money path signs through dig-account's
# canonical signer (Option A #1024); this dep names one shared `Network` type, no drifted copy.
dig-wallet-backend.workspace = true
# Shared byte-frozen constants (the profile-DEK at-rest byte contract) — see the workspace manifest.
dig-constants.workspace = true
# The canonical dig-app ⇄ dig-node IPC session/signing contract (dig_ecosystem#1074/#1081). This
# crate is the CLIENT half: it re-exports the contract's builders/traits/role-half from
# `crate::session` and supplies the app-specific concrete `SessionSigner` impls. Consuming the ONE
# published definition (also consumed by dig-node #1080) makes the app↔engine contract drift-proof.
dig-ipc-protocol.workspace = true
# The canonical dig-node CONTROL method catalog (#1152). `crate::control` carries these typed
# calls/results over the node's loopback JSON-RPC surface, so the method names + result shapes are
# the published contract rather than a hand-copied catalog that silently drifts.
dig-node-control-interface.workspace = true
# The canonical blockchain→app event CONTRACT (#1067). dig-app SUBSCRIBES to the WalletEvent stream
# through this — the `events` module drives the reactive UI + #970 notifications off it, and never
# re-declares the taxonomy. (The wallet-backend crate is named ONLY for its `Network` selector, above;
# the money path signs through dig-account's canonical signer, not the wallet-backend client seam.)
dig-events-protocol.workspace = true
async-trait.workspace = true
# The BIP-39 recovery phrase — see the workspace manifest. `account::recovery` is the ONLY module
# that touches it, and it maps a phrase to the 32-byte account master seed (never a hand-rolled
# wordlist or checksum).
bip39.workspace = true
hkdf.workspace = true
sha2.workspace = true
# The DIGCHAT1 sealed-envelope crypto (`identity.*` capability class, SPEC §5.6/#1931): X25519
# ephemeral-static key agreement (`x25519-dalek`, the SAME type dig-account hands out from
# `profile_sealing_key`) and XChaCha20-Poly1305 AEAD (`chacha20poly1305`). HKDF-SHA256 (`hkdf` above)
# derives the message key. Every primitive is RustCrypto/dalek and standard — nothing hand-rolled (NC-1).
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
# HMAC-SHA1 for RFC 6238 TOTP (`account::second_factor`) — see the workspace manifest for why SHA-1 is
# the right (and only interoperable) choice for a keyed one-time-password MAC.
sha1.workspace = true
# The QR encoder for the two-factor enrolment window (#1849) — see the workspace manifest for the
# supply-chain reasoning that picked a zero-dependency, unsafe-free encoder over both a larger crate
# and a vendored copy.
qrcodegen.workspace = true
zeroize.workspace = true
rand_core.workspace = true
base64.workspace = true
# Profiles (U5) — the canonical `did:chia:` profile FORMAT (consumed, never reinvented) + hex
# encoding for the human-readable registry.
dig-identity.workspace = true
hex.workspace = true

# Wallet host (U8) — the canonical chip35 DIG spend builder + the Chia types it works in. NO spend
# bundle is hand-rolled; the DIG treasury constant is reused from chip35 (see the `canonical` skill).
chip35-dl-coin.workspace = true
chia-bls.workspace = true
chia-protocol.workspace = true
chia-puzzle-types.workspace = true
chia-sdk-driver.workspace = true
chia-sdk-signer.workspace = true
# The condition parser + puzzle runner used by `decode` to render a spend bundle in human terms
# (CREATE_COIN recipients/amounts + fee) for the APP-SIGN sign-confirm window (SPEC §5.6.5).
chia-sdk-types.workspace = true
chia-sdk-utils.workspace = true
chia-traits.workspace = true
clvm-traits.workspace = true
clvmr.workspace = true
hex-literal.workspace = true

# APP-SIGN loopback identity channel (SIGN-1, SPEC §5.6). The extension↔dig-app paired WebSocket
# server + the pairing/auth security core live in `loopback` + `pairing` + `confirm`. `tokio` +
# `tokio-tungstenite` + `futures-util` are the async WS transport; `hmac` computes the per-frame
# pairing-token MAC with a constant-time `verify_slice`; `uuid` mints the opaque `pairing_id`. The
# HMAC reuses the existing `sha2` dep — no new crypto primitive is introduced.
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
hmac.workspace = true
uuid.workspace = true

# The OS credential store is the custody PRIMARY on Windows + macOS only (per-application access
# gating). It is deliberately NOT a dependency on Linux: keyutils is same-UID-readable + volatile, so
# Linux uses the passphrase-sealed file as its custody primary instead (see `keystore`). Gating the
# dependency by target means `keyring` is never compiled on Linux — no dbus/libsecret build tax.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring.workspace = true

# The single `flock` call behind the unix half of `single_instance` (dig_ecosystem#1831). Windows has
# its own std-only primitive (an open with share mode zero), so the dependency is unix-gated and never
# compiled for a Windows build.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The per-OS native confirmer (SIGN-3, SPEC §5.6.5) — the foreground consent window + biometric that
# is the ONLY authorization to sign. Each backend is gated to its own target so it never taxes the
# other platforms' builds. Linux needs no native crate (it drives desktop-dialog + polkit `pkcheck`
# subprocesses), so only Windows + macOS pull dependencies here.
[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-local-authentication.workspace = true
block2.workspace = true
dispatch2.workspace = true

[dev-dependencies]
png.workspace = true
tempfile.workspace = true
rand_chacha.workspace = true
# The IPC contract's ENGINE half (the same one dig-node runs) + base64 — used by the #1211 headline
# integration test (`tests/bls_ipc_session.rs`) to drive a real begin→attach handshake against the
# app's BLS `SessionSigner` and prove a current dig-app opens a session with a current dig-node.
dig-ipc-protocol.workspace = true
base64.workspace = true
# The never-log second-factor test computes a TOTP code INDEPENDENTLY of the crate under test, so the
# fixture agrees with RFC 4226 rather than with the implementation it is checking (#1840).
sha1.workspace = true
hmac.workspace = true
zeroize.workspace = true
# Capturing subscriber for the never-log regression tests (#934, dig-logging SPEC §7): a `fmt` layer
# writing into an in-memory buffer so a test can assert emitted records never contain secret values
# (a passphrase, a raw identity key). Pinned to the same 0.3 line `dig-logging` builds on.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
