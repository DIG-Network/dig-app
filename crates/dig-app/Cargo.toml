# The `dig-app` shell binary — a thin shell over `dig-app-core`.
#
#   * `dig-app` — the branded per-user tray / menu-bar agent shell (Windows system tray · macOS
#     menu-bar LSUIElement · Linux AppIndicator). Degrades headless (no tray) on a GUI-less host,
#     running as a per-user identity agent. U3 implements the shell.
#
# The user CLI (`dign`) lives in its own sibling `dign` crate (U7), migrated from dig-node. Both
# binaries stay intentionally minimal — they parse the invocation and hand off to `dig-app-core` —
# so coverage of real logic is measured in the core library. The release build ships BOTH binaries
# (per the #908 form factors). The one exception is `autostart` (src/lib.rs): the per-user autostart
# artifacts belong to the SHELL, not the identity-agent core, so they're unit-tested here directly.
[package]
name = "dig-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The DIG user app: the branded per-user tray/menu-bar identity agent shell (`dig-app`), fronting the identity-agnostic dig-node engine (dig_ecosystem#908)."

[[bin]]
name = "dig-app"
path = "src/bin/dig-app.rs"

[features]
# The desktop tray / menu-bar shell is on by default (release builds ship it), and degrades to the
# headless agent at runtime when no display is present. Build `--no-default-features` for a pure
# headless agent binary with no desktop (GTK/tao) dependency — e.g. a Linux server image.
default = ["tray"]
tray = ["dep:tray-icon", "dep:tao", "dep:png"]

[dependencies]
dig-app-core.workspace = true
tray-icon = { workspace = true, optional = true }
tao = { workspace = true, optional = true }
# Decodes the embedded DIG brand mark into the RGBA buffer `tray-icon` wants (`src/brand.rs`). Tray
# only: the headless binary paints nothing, so it carries neither the PNGs nor this decoder.
png = { workspace = true, optional = true }
# Structured logging (#934): the shared dual-sink (JSONL file + human stderr) building block, so the
# tray/headless agent shell — the process that actually runs for the user's whole session — gets a
# durable field log the same way dig-node/dig-dns/dig-updater do. See `src/logging.rs`.
dig-logging.workspace = true
tracing.workspace = true

# `AttachConsole`/`SetStdHandle` for `src/console.rs` (dig_ecosystem#1797). The shell is a GUI-subsystem
# binary, so it has no console of its own; the informational CLI paths (`--version`, which the update
# beacon health-gates on, and `--help`) attach to their launcher's console before printing. Target-specific
# so it never taxes the macOS/Linux builds, which need no such thing.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
# In-memory keystore + credential backends for the integration tests, so a REAL AccountResidency holding
# real derived key material can be built and locked without touching the OS credential store
# (`tests/tray_lock_state.rs`, dig_ecosystem#1752).
dig-keystore.workspace = true
dig-session.workspace = true
# Deriving the integration tests' passwords from a label rather than writing them inline, so no test
# password is a literal a static analyser reads as a hard-coded cryptographic value (#917/#950), and
# holding the typed password in a scrubbing buffer the way the real input window does.
sha2.workspace = true
hex.workspace = true
zeroize.workspace = true
# Driving the async auth ceremony from the manual visual check (`tests/account_windows_visual.rs`), which
# needs a runtime the way the production boot glue does.
tokio.workspace = true
